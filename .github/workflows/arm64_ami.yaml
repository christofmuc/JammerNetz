name: Publish ARM64 EC2 AMI

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Release tag to publish, or master for an unreleased build
        required: true
        default: master
        type: string
      aws_region:
        description: AWS region in which to create the AMI
        required: true
        default: eu-central-1
        type: string
      builder_instance_type:
        description: Temporary ARM64 EC2 instance used by Packer
        required: true
        default: t4g.small
        type: string

permissions:
  contents: read

jobs:
  validate_request:
    name: Validate publication request
    runs-on: ubuntu-24.04
    outputs:
      checkout_ref: ${{ steps.validate.outputs.checkout_ref }}
    steps:
    - name: Require the protected workflow and a release source
      id: validate
      env:
        SOURCE_REF: ${{ inputs.source_ref }}
      run: |
        if [[ "${GITHUB_REF}" != "refs/heads/master" ]]; then
          echo "::error::Run this workflow from master and select the release tag in the source_ref input." >&2
          exit 1
        fi
        if [[ "${SOURCE_REF}" != "master" && ! "${SOURCE_REF}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::source_ref must be master or a numeric release tag such as 2.4.1." >&2
          exit 1
        fi
        if [[ "${SOURCE_REF}" == "master" ]]; then
          echo "checkout_ref=refs/heads/master" >> "${GITHUB_OUTPUT}"
        else
          echo "checkout_ref=refs/tags/${SOURCE_REF}" >> "${GITHUB_OUTPUT}"
        fi

  build_server_arm64:
    needs: validate_request
    uses: ./.github/workflows/arm64_server.yaml
    with:
      source_ref: ${{ needs.validate_request.outputs.checkout_ref }}
    permissions:
      contents: read
      pull-requests: read

  publish_ami:
    name: Publish private ARM64 AMI
    needs: [validate_request, build_server_arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ami-production
    concurrency:
      group: jammernetz-arm64-ami-publication
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: ${{ needs.validate_request.outputs.checkout_ref }}

    - name: Resolve source commit
      id: source
      run: |
        source_commit="$(git rev-parse HEAD)"
        echo "commit=${source_commit}" >> "${GITHUB_OUTPUT}"
        echo "commit_short=${source_commit:0:12}" >> "${GITHUB_OUTPUT}"

    - name: Download ARM64 server artifact
      uses: actions/download-artifact@v8
      with:
        name: JammerNetzServer-arm64
        path: aws/ami/staging

    - name: Verify downloaded artifact
      run: |
        chmod 0755 aws/ami/staging/JammerNetzServer
        file aws/ami/staging/JammerNetzServer
        grep -q "aarch64\|ARM aarch64" <(file aws/ami/staging/JammerNetzServer)

    - name: Install Packer
      env:
        PACKER_VERSION: 1.16.0
      run: bash aws/ami/scripts/install-packer.sh

    - name: Validate publishing environment configuration
      env:
        AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      run: |
        if [[ -z "${AWS_ROLE_ARN}" || -z "${AWS_ACCOUNT_ID}" ]]; then
          echo "The ami-production environment must define AWS_ROLE_ARN and AWS_ACCOUNT_ID." >&2
          exit 1
        fi

    - name: Configure short-lived AWS credentials
      uses: aws-actions/configure-aws-credentials@v6.2.3
      with:
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
        aws-region: ${{ inputs.aws_region }}
        allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
        role-session-name: JammerNetzAmi-${{ github.run_id }}

    - name: Validate Packer template
      working-directory: aws/ami
      run: |
        packer init .
        packer fmt -check -recursive .
        packer validate \
          -var "aws_region=${{ inputs.aws_region }}" \
          -var "builder_instance_type=${{ inputs.builder_instance_type }}" \
          .

    - name: Build AMI
      working-directory: aws/ami
      env:
        AWS_REGION: ${{ inputs.aws_region }}
        BUILDER_INSTANCE_TYPE: ${{ inputs.builder_instance_type }}
        SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        SOURCE_COMMIT_SHORT: ${{ steps.source.outputs.commit_short }}
      run: |
        set -o pipefail
        created_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        build_timestamp="$(date -u +%Y%m%d%H%M%S)"

        packer build -color=false -on-error=cleanup \
          -var "aws_region=${AWS_REGION}" \
          -var "builder_instance_type=${BUILDER_INSTANCE_TYPE}" \
          -var "source_commit=${SOURCE_COMMIT}" \
          -var "source_commit_short=${SOURCE_COMMIT_SHORT}" \
          -var "source_repository=${GITHUB_REPOSITORY}" \
          -var "workflow_run_id=${GITHUB_RUN_ID}" \
          -var "created_at=${created_at}" \
          -var "build_timestamp=${build_timestamp}" \
          . 2>&1 | tee packer.log

    - name: Report AMI
      id: ami
      working-directory: aws/ami
      env:
        AWS_REGION: ${{ inputs.aws_region }}
        SOURCE_REF: ${{ inputs.source_ref }}
        SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
      run: |
        ami_id="$(jq -er '.builds[-1].artifact_id | split(":") | last' packer-manifest.json)"
        aws ec2 describe-images --region "${AWS_REGION}" --owners self --image-ids "${ami_id}" >/dev/null
        echo "ami_id=${ami_id}" >> "${GITHUB_OUTPUT}"
        {
          echo "## JammerNetz ARM64 AMI"
          echo
          echo "- AMI ID: \`${ami_id}\`"
          echo "- Region: \`${AWS_REGION}\`"
          echo "- Source ref: \`${SOURCE_REF}\`"
          echo "- Source commit: \`${SOURCE_COMMIT}\`"
          echo "- Architecture: \`arm64\`"
          echo "- Base OS: \`Ubuntu 24.04 LTS\`"
        } >> "${GITHUB_STEP_SUMMARY}"

    - name: Upload Packer logs and manifest
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: JammerNetzServer-arm64-ami-${{ github.run_id }}
        path: |
          aws/ami/packer.log
          aws/ami/packer-manifest.json
        if-no-files-found: warn
        retention-days: 30
