name: ARM64 Server Build

on:
  pull_request:
  push:
  workflow_call:
    inputs:
      source_ref:
        description: Optional branch, tag, or commit to check out and build
        required: false
        type: string
permissions:
  contents: read
  pull-requests: read

jobs:
  skip_duplicate_push:
    runs-on: ubuntu-latest
    outputs:
      run_build: ${{ steps.decide.outputs.run_build }}
    steps:
    - name: Decide whether to run build
      id: decide
      uses: actions/github-script@v7
      with:
        script: |
          if (context.eventName !== 'push') {
            core.setOutput('run_build', 'true');
            return;
          }

          const branch = context.ref.replace('refs/heads/', '');
          try {
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${branch}`,
              per_page: 1
            });

            const runBuild = prs.length === 0;
            core.info(runBuild
              ? `No open PR for branch '${branch}', running push build.`
              : `Branch '${branch}' already has an open PR, skipping duplicate push build.`);
            core.setOutput('run_build', runBuild ? 'true' : 'false');
          } catch (error) {
            core.warning(`Could not check open PRs for '${branch}', running push build anyway: ${error.message}`);
            core.setOutput('run_build', 'true');
          }

  build_server_arm64:
    needs: skip_duplicate_push
    if: needs.skip_duplicate_push.outputs.run_build == 'true'
    runs-on: ubuntu-24.04-arm

    steps:
    - name: Disable git automatic line ending conversion
      run: git config --global core.autocrlf false

    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.source_ref || github.sha }}
        submodules: 'recursive'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ cmake ninja-build pkg-config nlohmann-json3-dev libncurses-dev libglew-dev
        sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype-dev libfontconfig1-dev
        sudo apt-get install -y libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install locked Conan dependencies
      run: |
        pip install conan==2.20.1
        conan profile detect
        conan install . -of conan-deps -s build_type=RelWithDebInfo --build=missing --lockfile=conan.lock

    - name: Build Flatbuffers
      run: |
        cmake -S third_party/flatbuffers -B third_party/flatbuffers/LinuxBuilds -G Ninja -DCMAKE_BUILD_TYPE=Release
        cmake --build third_party/flatbuffers/LinuxBuilds --parallel

    - name: Build JammerNetzServer
      run: |
        cmake -S . -B builds-arm64-server -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/conan-deps/conan_toolchain.cmake" -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DBUILD_JAMMERNETZ_CLIENT=OFF -DJAMMERNETZ_ENABLE_LTO=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        cmake --build builds-arm64-server --parallel
        ctest --test-dir builds-arm64-server --output-on-failure

    - name: Inspect ARM64 server artifact
      run: |
        file builds-arm64-server/Server/JammerNetzServer
        ldd builds-arm64-server/Server/JammerNetzServer | tee builds-arm64-server/Server/runtime-dependencies.txt
        if grep -q "not found" builds-arm64-server/Server/runtime-dependencies.txt; then
          echo "The server artifact has unresolved runtime dependencies."
          exit 1
        fi

    - name: Upload ARM64 Server Artifact
      uses: actions/upload-artifact@v7
      with:
        name: JammerNetzServer-arm64
        path: |
          builds-arm64-server/Server/JammerNetzServer
          builds-arm64-server/Server/runtime-dependencies.txt
        if-no-files-found: error
        retention-days: 7
